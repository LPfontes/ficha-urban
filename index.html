        .sheet-container {

            width: 100%;

            background-repeat: no-repeat;
            background-color: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);

        /* ESTILO DOS CAMPOS DE TEXTO */
        .field {
            position: absolute; /* Permite mover livremente sobre a imagem */

            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            color: #000;
            padding: 2px 5px;

        /* Remove a borda azul ao clicar */

            background-color: rgba(255, 255, 255, 0); /* Destaque ao digitar */

            width: 15px;
            height: 15px;
            cursor: pointer;

    <script>
        // Script simples para trocar de aba
        const selector = document.getElementById('selector');
        const sheets = document.querySelectorAll('.sheet-container');

        selector.addEventListener('change', (e) => {
            sheets.forEach(sheet => sheet.classList.remove('active'));
            const activeSheet = document.getElementById(e.target.value);
            if(activeSheet) activeSheet.classList.add('active');
        });

        function toggleLayout() {
            sheets.forEach(sheet => sheet.classList.toggle('side-by-side'));
        }

        function addEquipment() {
            const container = document.getElementById('equipamentos-container');
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'equipment-input';
            input.placeholder = 'item...';
            container.appendChild(input);
        }
